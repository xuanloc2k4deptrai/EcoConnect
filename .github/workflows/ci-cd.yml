name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Backend API Tests
  backend-test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        working-directory: ./backend-api
        run: npm ci
        
      - name: Run linter
        working-directory: ./backend-api
        run: npm run lint
        
      - name: Run tests
        working-directory: ./backend-api
        run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/ecoconnect_test
          REDIS_URL: redis://localhost:6379

  # Frontend Tests
  frontend-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        working-directory: ./frontend-web
        run: npm ci
        
      - name: Run linter
        working-directory: ./frontend-web
        run: npm run lint
        
      - name: Type check
        working-directory: ./frontend-web
        run: npm run type-check
        
      - name: Build
        working-directory: ./frontend-web
        run: npm run build

  # AI Service Tests
  ai-service-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        working-directory: ./ai-service
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          
      - name: Run tests
        working-directory: ./ai-service
        run: pytest

  # Blockchain Tests
  blockchain-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        working-directory: ./blockchain
        run: npm ci
        
      - name: Compile contracts
        working-directory: ./blockchain
        run: npm run compile
        
      - name: Run tests
        working-directory: ./blockchain
        run: npm test

  # Build and Push Docker Images
  docker-build:
    needs: [backend-test, frontend-test, ai-service-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend-api
          push: true
          tags: ecoconnect/backend-api:latest
          
      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend-web
          push: true
          tags: ecoconnect/frontend-web:latest
          
      - name: Build and push AI Service
        uses: docker/build-push-action@v4
        with:
          context: ./ai-service
          push: true
          tags: ecoconnect/ai-service:latest

  # Deploy to staging (optional)
  deploy-staging:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment"
          # Add deployment commands here
